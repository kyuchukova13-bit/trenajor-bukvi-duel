<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Тренажор по писане - Състезателен двубой</title>
    <style>
        @font-face {
            font-family: 'BoyanMaga';
            src: url('Boyan_Maga-Regular.ttf') format('truetype');
        }
        :root { --dark: #2c3e50; --blue: #3498db; --green: #2ecc71; --red: #e74c3c; --orange: #e67e22; --bg: #f0f2f5; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; height: 100vh; height: 100dvh; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: var(--bg); touch-action: none; }

        .font-loader { font-family: 'BoyanMaga'; position: absolute; opacity: 0; pointer-events: none; }

        /* НАЧАЛЕН ЕКРАН */
        #start-screen { position: fixed; inset: 0; background: var(--dark); display: flex; align-items: center; justify-content: center; z-index: 3000; }
        .welcome-box { background: white; width: 90%; max-width: 750px; padding: 40px; border-radius: 25px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
        .welcome-box h1 { margin-top: 0; color: var(--dark); font-size: 2.2rem; border-bottom: 3px solid var(--blue); padding-bottom: 15px; }
        .big-btn { padding: 18px 40px; font-size: 1.5rem; border: none; border-radius: 15px; cursor: pointer; color: white; font-weight: bold; margin: 10px; transition: transform 0.1s; }
        .big-btn:active { transform: scale(0.96); }

        /* РАБОТНО ПОЛЕ */
        .app-layout { display: none; flex-direction: column; height: 100vh; height: 100dvh; width: 100vw; overflow: hidden; }

        .levels-bar { height: 90px; min-height: 90px; flex-shrink: 0; background: #1a1a1a; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; padding: 5px 0; }
        .dots-row { display: flex; gap: 30px; margin-bottom: 4px; }
        
        /* КРЪГЧЕТА И ПРОЦЕНТИ ЗА 3-ТЕ БУКВИ В ГОРНАТА ЛЕНТА */
        .dot-wrapper { display: flex; flex-direction: column; align-items: center; gap: 2px; }
        .dot { width: 34px; height: 34px; border-radius: 50%; border: 2px solid white; display: flex; overflow: hidden; background: #7f8c8d; transition: transform 0.2s, border-color 0.2s; position: relative; }
        .dot-half { flex: 1; height: 100%; transition: background 0.3s; }
        .dot-half-left { border-right: 1px solid rgba(255,255,255,0.4); }
        .dot-label { font-size: 0.85rem; color: #ffffff; font-weight: bold; }
        .dot-scores { font-size: 0.78rem; font-weight: bold; display: flex; gap: 3px; align-items: center; }
        .dot-score-p1 { color: #bdc3c7; }
        .dot-score-p2 { color: #bdc3c7; }
        .dot-score-sep { color: #555; font-size: 0.7rem; }

        /* РАБОТНА ЗОНА С ДВЕТЕ ПЛАТНА */
        .workspace { display: flex; flex: 1; min-height: 0; gap: 15px; padding: 12px 15px; background: #dfe6e9; overflow: hidden; }
        .canvas-container { 
            flex: 1; min-height: 0; background: white; border-radius: 20px; 
            position: relative; border: 3px solid #ccc; overflow: hidden; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
        }
        .player-tag { 
            position: absolute; top: 12px; left: 15px; 
            background: rgba(44, 62, 80, 0.88); color: white; 
            padding: 6px 16px; border-radius: 20px; font-weight: bold; 
            font-size: 1rem; z-index: 5; pointer-events: none; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.15); 
        }
        
        /* КУТИЯ ЗА ПРОЦЕНТА НЕПОСРЕДСТВЕНО ПОД ВСЯКА БУКВА / CANVAS */
        .canvas-score-display {
            position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 8px 24px; border-radius: 25px;
            font-size: 1.8rem; font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.25);
            z-index: 10; display: none; transition: all 0.3s ease;
            border: 3px solid transparent;
            text-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        canvas { width: 100%; height: 100%; display: block; touch-action: none; border-radius: 17px; }
        
        .footer { height: 85px; min-height: 85px; flex-shrink: 0; background: var(--dark); display: flex; align-items: center; justify-content: center; gap: 20px; padding: 10px 20px; }
        .footer-btn { padding: 15px 40px; border-radius: 15px; border: none; font-weight: bold; font-size: 1.25rem; cursor: pointer; color: white; text-transform: uppercase; transition: transform 0.1s, background 0.2s; }
        .footer-btn:active { transform: scale(0.95); }

        /* ФИНАЛЕН ЕКРАН */
        #final-screen { position: fixed; inset: 0; background: var(--dark); display: none; align-items: center; justify-content: center; z-index: 3000; color: white; padding: 20px; }
        .final-box { background: #112233; border: 3px solid var(--blue); width: 95%; max-width: 800px; padding: 35px; border-radius: 25px; text-align: center; box-shadow: 0 15px 40px rgba(0,0,0,0.6); }
        .final-box h1 { font-size: 2.5rem; margin-top: 0; color: #f1c40f; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        .score-table { width: 100%; margin: 25px 0; border-collapse: collapse; color: white; }
        .score-table th, .score-table td { padding: 12px 18px; border-bottom: 1px solid #334455; text-align: center; font-size: 1.2rem; }
        .score-table th { background: rgba(52, 152, 219, 0.35); font-size: 1.25rem; }
    </style>
</head>
<body>

<div class="font-loader">Зареждане на ръкописен шрифт...</div>

<div id="start-screen">
    <div class="welcome-box">
        <h1>ДВУБОЙ ПО ПИСАНЕ (3 БУКВИ)</h1>
        <p style="font-size: 1.15rem; color: #555; margin-bottom: 25px;">Изберете категория за състезанието между Ученик 1 и Ученик 2:</p>
        <button class="big-btn" style="background: var(--orange);" onclick="startGame('гласни')">ГЛАСНИ</button>
        <button class="big-btn" style="background: var(--blue);" onclick="startGame('съгласни')">СЪГЛАСНИ</button>
    </div>
</div>

<div id="final-screen">
    <div class="final-box">
        <h1 id="winner-msg">🏆 ПОБЕДИТЕЛ В ДВУБОЯ!</h1>
        
        <table class="score-table">
            <thead>
                <tr>
                    <th>Буква</th>
                    <th>Ученик 1</th>
                    <th>Ученик 2</th>
                    <th>Победител</th>
                </tr>
            </thead>
            <tbody id="score-table-body"></tbody>
        </table>

        <div style="display: flex; justify-content: space-around; font-size: 1.5rem; font-weight: bold; margin: 25px 0;">
            <div>Средна оценка Ученик 1: <span id="f-score0" style="color: var(--green);">0%</span></div>
            <div>Средна оценка Ученик 2: <span id="f-score1" style="color: var(--blue);">0%</span></div>
        </div>

        <button class='big-btn' style="background: var(--orange); margin-top: 10px;" onclick='location.reload()'>НОВА ИГРА 🔄</button>
    </div>
</div>

<div id="app" class="app-layout">
    <div class="levels-bar">
        <div class="dots-row" id="nav-dots"></div>
        <div id="level-text" style="font-weight: bold; letter-spacing: 1px; font-size: 1.1rem; margin-top: 2px;">БУКВА 1 ОТ 3</div>
    </div>
    <div class="workspace">
        <div class="canvas-container" id="container-0">
            <div class="player-tag">УЧЕНИК 1</div>
            <canvas id="c0"></canvas>
            <div class="canvas-score-display" id="score-tag-0">0%</div>
        </div>
        <div class="canvas-container" id="container-1">
            <div class="player-tag">УЧЕНИК 2</div>
            <canvas id="c1"></canvas>
            <div class="canvas-score-display" id="score-tag-1">0%</div>
        </div>
    </div>
    <div class="footer">
        <button class="footer-btn" id="btn-check" style="background: var(--green);" onclick="handleCheckOrNext()">ПРОВЕРИ</button>
        <button class="footer-btn" id="btn-clear" style="background: var(--red);" onclick="clearCanvases()">ИЗЧИСТИ</button>
    </div>
</div>

<!-- Скрити платна за двуслойна прецизна проверка -->
<canvas id="hidden-canvas-core" style="display:none;"></canvas>
<canvas id="hidden-canvas-tol" style="display:none;"></canvas>

<script>
    const data = {
        'гласни': ['А', 'Ъ', 'О', 'У', 'Е', 'И'],
        'съгласни': ['Б', 'В', 'Г', 'Д', 'Ж', 'З', 'К', 'Л', 'М', 'Н', 'П', 'Р', 'С', 'Т']
    };
    
    let state = { letters: [], curIdx: 0, isChecked: false };
    let sessionScores = [[0,0,0], [0,0,0]];
    let drawing = [false, false];
    
    const cans = [document.getElementById('c0'), document.getElementById('c1')];
    const ctxs = cans.map(c => c.getContext('2d', {willReadFrequently: true}));

    const userCanvases = [document.createElement('canvas'), document.createElement('canvas')];
    const userCtxs = userCanvases.map(uc => uc.getContext('2d', {willReadFrequently: true}));

    const hCanCore = document.getElementById('hidden-canvas-core');
    const hCtxCore = hCanCore.getContext('2d', {willReadFrequently: true});
    
    const hCanTol = document.getElementById('hidden-canvas-tol');
    const hCtxTol = hCanTol.getContext('2d', {willReadFrequently: true});

    // ПОМОЩНА ФУНКЦИЯ ЗА ОПРЕДЕЛЯНЕ НА ЦВЯТ СПОРЕД ПРОЦЕНТИТЕ:
    // Над 80% -> Зелено
    // От 50% до 80% -> Оранжево
    // Под 50% -> Червено
    function getScoreColor(score) {
        if (score >= 80) return "#2ecc71"; // Зелено
        if (score >= 50) return "#e67e22"; // Оранжево
        return "#e74c3c";                  // Червено
    }

    function startGame(cat) {
        state.letters = data[cat].sort(() => 0.5 - Math.random()).slice(0, 3);
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('app').style.display = 'flex';
        buildDots();
        drawScene(); 
    }

    function buildDots() {
        const container = document.getElementById('nav-dots');
        container.innerHTML = '';
        for(let i=0; i<3; i++) {
            const wrap = document.createElement('div');
            wrap.className = 'dot-wrapper';
            
            const d = document.createElement('div');
            d.className = 'dot';
            d.id = `dot-${i}`;
            d.innerHTML = `<div class="dot-half dot-half-left" id="dot-${i}-0"></div><div class="dot-half" id="dot-${i}-1"></div>`;
            
            const lbl = document.createElement('div');
            lbl.className = 'dot-label';
            lbl.innerText = state.letters[i] || (i+1);
            lbl.id = `dot-lbl-${i}`;
            
            const scoresDiv = document.createElement('div');
            scoresDiv.className = 'dot-scores';
            scoresDiv.id = `dot-scores-${i}`;
            scoresDiv.innerHTML = `
                <span class="dot-score-p1" id="dot-sc-${i}-0">--</span>
                <span class="dot-score-sep">|</span>
                <span class="dot-score-p2" id="dot-sc-${i}-1">--</span>
            `;

            wrap.appendChild(d);
            wrap.appendChild(lbl);
            wrap.appendChild(scoresDiv);
            container.appendChild(wrap);
        }
    }

    function syncSizes() {
        cans.forEach((c, i) => {
            const w = c.parentElement.clientWidth;
            const h = c.parentElement.clientHeight;
            c.width = w;
            c.height = h;
            userCanvases[i].width = w;
            userCanvases[i].height = h;
        });
        hCanCore.width = cans[0].width;
        hCanCore.height = cans[0].height;
        hCanTol.width = cans[0].width;
        hCanTol.height = cans[0].height;
    }

    function clearCanvases() {
        state.isChecked = false;
        
        // Скриваме етикетите за процент под буквите
        document.getElementById('score-tag-0').style.display = 'none';
        document.getElementById('score-tag-1').style.display = 'none';
        
        // Връщаме бутона "ПРОВЕРИ"
        const btnCheck = document.getElementById('btn-check');
        btnCheck.innerText = "ПРОВЕРИ";
        btnCheck.style.background = "var(--green)";

        drawScene();
    }

    function drawScene() {
        drawing = [false, false];

        const L = state.letters[state.curIdx];
        document.getElementById('level-text').innerText = `БУКВА ${state.curIdx + 1} ОТ 3 (${L}${L.toLowerCase()})`;

        syncSizes();

        cans.forEach((c, i) => {
            const ctx = ctxs[i];
            const uCtx = userCtxs[i];
            const mid = c.height / 2;
            const rowH = Math.min(90, c.height / 4.5);
            const baseLine = mid + rowH/2;

            ctx.clearRect(0, 0, c.width, c.height);
            uCtx.clearRect(0, 0, c.width, c.height);

            // Линиатура
            ctx.strokeStyle = "#74b9ff"; ctx.lineWidth = 2.5;
            [mid - rowH*1.5, mid - rowH/2, mid + rowH/2, mid + rowH*1.5].forEach(y => {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(c.width, y); ctx.stroke();
            });

            // Бял шаблон с пунктирни очертания
            ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
            
            ctx.font = (rowH * 2.0) + "px 'BoyanMaga'";
            ctx.fillStyle = "#f8f9fa";
            ctx.fillText(L, c.width/2 - rowH*1.2, baseLine - 3);
            ctx.strokeStyle = "#a5b1c2"; ctx.lineWidth = 2; ctx.setLineDash([8, 5]);
            ctx.strokeText(L, c.width/2 - rowH*1.2, baseLine - 3);

            ctx.font = (rowH * 1.5) + "px 'BoyanMaga'";
            ctx.fillText(L.toLowerCase(), c.width/2 + rowH*1.2, baseLine - 3);
            ctx.strokeText(L.toLowerCase(), c.width/2 + rowH*1.2, baseLine - 3);
            ctx.setLineDash([]);
        });

        drawHiddenTargets();
    }

    function drawHiddenTargets() {
        const mid = hCanCore.height / 2; 
        const rowH = Math.min(90, hCanCore.height / 4.5); 
        const baseLine = mid + rowH/2;
        const L = state.letters[state.curIdx];

        hCtxCore.clearRect(0, 0, hCanCore.width, hCanCore.height);
        hCtxCore.textAlign = "center"; hCtxCore.textBaseline = "alphabetic";
        hCtxCore.lineJoin = "round"; hCtxCore.lineCap = "round";
        hCtxCore.lineWidth = 14; 
        hCtxCore.strokeStyle = "#000000"; 
        hCtxCore.font = (rowH * 2.0) + "px 'BoyanMaga'";
        hCtxCore.strokeText(L, hCanCore.width/2 - rowH*1.2, baseLine - 3);
        hCtxCore.font = (rowH * 1.5) + "px 'BoyanMaga'";
        hCtxCore.strokeText(L.toLowerCase(), hCanCore.width/2 + rowH*1.2, baseLine - 3);

        hCtxTol.clearRect(0, 0, hCanTol.width, hCanTol.height);
        hCtxTol.textAlign = "center"; hCtxTol.textBaseline = "alphabetic";
        hCtxTol.lineJoin = "round"; hCtxTol.lineCap = "round";
        hCtxTol.lineWidth = 38; 
        hCtxTol.strokeStyle = "#000000"; 
        hCtxTol.font = (rowH * 2.0) + "px 'BoyanMaga'";
        hCtxTol.strokeText(L, hCanTol.width/2 - rowH*1.2, baseLine - 3);
        hCtxTol.font = (rowH * 1.5) + "px 'BoyanMaga'";
        hCtxTol.strokeText(L.toLowerCase(), hCanTol.width/2 + rowH*1.2, baseLine - 3);
    }

    function getRealScore(idx) {
        const uData = userCtxs[idx].getImageData(0, 0, cans[idx].width, cans[idx].height).data;
        const coreData = hCtxCore.getImageData(0, 0, hCanCore.width, hCanCore.height).data;
        const tolData = hCtxTol.getImageData(0, 0, hCanTol.width, hCanTol.height).data;
        
        let userPx = 0;
        let corePx = 0;
        let coreHits = 0;
        let tolHits = 0;

        for (let i = 0; i < uData.length; i += 4) {
            const isUser = uData[i + 3] > 30;
            const isCore = coreData[i + 3] > 30;
            const isTol = tolData[i + 3] > 30;

            if (isCore) corePx++;
            if (isUser) {
                userPx++;
                if (isTol) tolHits++;
                if (isCore) coreHits++;
            }
        }

        if (userPx === 0) return 0;

        const precision = tolHits / userPx; 
        const coreCoverage = corePx > 0 ? coreHits / corePx : 0; 
        const strokeCompletion = Math.min(1.0, coreCoverage / 0.60);

        let score = Math.pow(strokeCompletion, 0.7) * Math.pow(precision, 1.4);

        if (strokeCompletion < 0.25) {
            score *= (strokeCompletion / 0.25);
        }

        return Math.max(0, Math.min(100, Math.round(score * 100)));
    }

    function handleCheckOrNext() {
        if (!state.isChecked) {
            // ФАЗА 1: НАТИСНАТ Е БУТОНА "ПРОВЕРИ" -> ПРЕСМЯТАМЕ И ПОКАЗВАМЕ ПРОЦЕНТИТЕ ПОД ВСЯКА БУКВА
            const s0 = getRealScore(0); 
            const s1 = getRealScore(1);
            sessionScores[0][state.curIdx] = s0; 
            sessionScores[1][state.curIdx] = s1;

            // Показваме процента под платното на Ученик 1
            const tag0 = document.getElementById('score-tag-0');
            const col0 = getScoreColor(s0);
            tag0.innerText = s0 + "%";
            tag0.style.color = col0;
            tag0.style.borderColor = col0;
            tag0.style.display = 'block';

            // Показваме процента под платното на Ученик 2
            const tag1 = document.getElementById('score-tag-1');
            const col1 = getScoreColor(s1);
            tag1.innerText = s1 + "%";
            tag1.style.color = col1;
            tag1.style.borderColor = col1;
            tag1.style.display = 'block';

            // Обновяваме индикаторите и процентите в горната лента
            updateTopDot(state.curIdx, 0, s0);
            updateTopDot(state.curIdx, 1, s1);

            state.isChecked = true;

            // Променяме бутона за преминаване към следваща буква или финал
            const btnCheck = document.getElementById('btn-check');
            if (state.curIdx < 2) {
                btnCheck.innerText = "СЛЕДВАЩА БУКВА ➡️";
                btnCheck.style.background = "var(--blue)";
            } else {
                btnCheck.innerText = "ФИНАЛЕН РЕЗУЛТАТ 🏆";
                btnCheck.style.background = "var(--orange)";
            }
        } else {
            // ФАЗА 2: НАТИСНАТ Е БУТОНА "СЛЕДВАЩА БУКВА" / "ФИНАЛЕН РЕЗУЛТАТ"
            state.isChecked = false;
            
            // Скриваме етикетите с проценти за новата буква
            document.getElementById('score-tag-0').style.display = 'none';
            document.getElementById('score-tag-1').style.display = 'none';
            
            // Връщаме бутона на "ПРОВЕРИ"
            const btnCheck = document.getElementById('btn-check');
            btnCheck.innerText = "ПРОВЕРИ";
            btnCheck.style.background = "var(--green)";

            if (state.curIdx < 2) {
                state.curIdx++;
                drawScene();
            } else {
                showFinalScreen();
            }
        }
    }

    function updateTopDot(idx, player, score) {
        const side = document.getElementById(`dot-${idx}-${player}`);
        const scEl = document.getElementById(`dot-sc-${idx}-${player}`);
        const color = getScoreColor(score);

        if (side) {
            side.style.background = color;
        }

        if (scEl) {
            scEl.innerText = score + "%";
            scEl.style.color = color;
        }
    }

    function showFinalScreen() {
        document.getElementById('app').style.display = 'none';
        
        let sum0 = sessionScores[0].reduce((a,b)=>a+b, 0);
        let sum1 = sessionScores[1].reduce((a,b)=>a+b, 0);
        let avg0 = Math.round(sum0 / 3);
        let avg1 = Math.round(sum1 / 3);

        const f0 = document.getElementById('f-score0');
        const f1 = document.getElementById('f-score1');
        
        f0.innerText = avg0 + "%";
        f0.style.color = getScoreColor(avg0);

        f1.innerText = avg1 + "%";
        f1.style.color = getScoreColor(avg1);

        const tbody = document.getElementById('score-table-body');
        tbody.innerHTML = '';

        for(let i=0; i<3; i++) {
            const sc0 = sessionScores[0][i];
            const sc1 = sessionScores[1][i];
            let winnerText = "🤝 Равенство";
            let winnerColor = "#f1c40f";

            if (sc0 > sc1) {
                winnerText = "🥇 Ученик 1";
                winnerColor = "#2ecc71";
            } else if (sc1 > sc0) {
                winnerText = "🥇 Ученик 2";
                winnerColor = "#3498db";
            }

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${state.letters[i]}</strong></td>
                <td style="color: ${getScoreColor(sc0)}; font-weight:bold;">${sc0}%</td>
                <td style="color: ${getScoreColor(sc1)}; font-weight:bold;">${sc1}%</td>
                <td style="color: ${winnerColor}; font-weight:bold;">${winnerText}</td>
            `;
            tbody.appendChild(tr);
        }

        let msg = document.getElementById('winner-msg');
        if(avg0 > avg1) {
            msg.innerText = "🏆 ПОБЕДИТЕЛ В ДВУБОЯ Е УЧЕНИК 1!";
            msg.style.color = "#2ecc71";
        } else if(avg1 > avg0) {
            msg.innerText = "🏆 ПОБЕДИТЕЛ В ДВУБОЯ Е УЧЕНИК 2!";
            msg.style.color = "#3498db";
        } else {
            msg.innerText = "🤝 РАВЕНСТВО В ДВУБОЯ! И ДВАМАТА СТЕ СТРАХОТНИ!";
            msg.style.color = "#f1c40f";
        }

        document.getElementById('final-screen').style.display = 'flex';
    }

    cans.forEach((c, i) => {
        const getPos = (e) => {
            const r = c.getBoundingClientRect();
            const scaleX = c.width / r.width;
            const scaleY = c.height / r.height;
            return { 
                x: (e.clientX - r.left) * scaleX, 
                y: (e.clientY - r.top) * scaleY 
            };
        };

        const startPointer = (e) => {
            e.preventDefault();
            
            // Ако вече е проверено, нов щрих автоматично нулира проверката за повторен опит
            if (state.isChecked) {
                state.isChecked = false;
                document.getElementById('score-tag-0').style.display = 'none';
                document.getElementById('score-tag-1').style.display = 'none';
                const btnCheck = document.getElementById('btn-check');
                btnCheck.innerText = "ПРОВЕРИ";
                btnCheck.style.background = "var(--green)";
            }

            const p = getPos(e);

            drawing[i] = true; 
            
            if (c.setPointerCapture && e.pointerId) {
                try { c.setPointerCapture(e.pointerId); } catch(err) {}
            }

            ctxs[i].beginPath(); 
            ctxs[i].moveTo(p.x, p.y);

            userCtxs[i].beginPath(); 
            userCtxs[i].moveTo(p.x, p.y);
        };

        const movePointer = (e) => {
            if(!drawing[i]) return;
            e.preventDefault();
            const p = getPos(e);
            
            ctxs[i].lineTo(p.x, p.y); 
            ctxs[i].strokeStyle = "#2c3e50"; 
            ctxs[i].lineWidth = 9; 
            ctxs[i].lineCap = "round"; 
            ctxs[i].lineJoin = "round";
            ctxs[i].stroke();

            userCtxs[i].lineTo(p.x, p.y); 
            userCtxs[i].strokeStyle = "#2c3e50"; 
            userCtxs[i].lineWidth = 9; 
            userCtxs[i].lineCap = "round"; 
            userCtxs[i].lineJoin = "round";
            userCtxs[i].stroke();
        };

        const stopPointer = (e) => {
            if (!drawing[i]) return;
            drawing[i] = false;
            if (c.releasePointerCapture && e.pointerId) {
                try { c.releasePointerCapture(e.pointerId); } catch(err) {}
            }
        };

        c.addEventListener('pointerdown', startPointer); 
        c.addEventListener('pointermove', movePointer);
        c.addEventListener('pointerup', stopPointer);
        c.addEventListener('pointercancel', stopPointer);
        c.addEventListener('pointerleave', stopPointer);
    });

    window.addEventListener('pointerup', () => { drawing = [false, false]; });
    window.addEventListener('pointercancel', () => { drawing = [false, false]; });
    window.addEventListener('resize', drawScene);
</script>
</body>
</html>
